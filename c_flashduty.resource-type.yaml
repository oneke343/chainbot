description: FlashDuty standard alert integration endpoint and credentials.
format_extension: null
is_fileset: false
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  additionalProperties: false
  properties:
    integration_key:
      type: string
      description: Integration key from a FlashDuty standard alert integration.
      maxLength: 500
      minLength: 1
    url:
      type: string
      description: FlashDuty standard alert event endpoint URL.
      format: uri
      maxLength: 2048
      minLength: 1
  required:
    - url
    - integration_key
