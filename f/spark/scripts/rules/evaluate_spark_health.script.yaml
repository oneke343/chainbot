summary: Evaluate SparkLend position risks and save MonitorState
description: Normalize SparkLend Pool results and run the common position-risk engine.
lock: '!inline f/spark/scripts/rules/evaluate_spark_health.script.lock'
kind: script
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  properties:
    chain_ids:
      type: array
      description: ''
      default: []
      items:
        type: number
      originalType: number[]
    default_threshold:
      type: number
      description: ''
      default: null
      exclusiveMinimum: 0
    inputs:
      type: object
      description: ''
      default: null
      properties:
        accounts:
          type: object
          description: ''
          format: resource-array
        observed_at:
          type: string
          description: ''
          originalType: string
        user:
          type: string
          description: ''
          originalType: string
    market_thresholds:
      type: object
      description: ''
      default: {}
      format: resource-record
    message_policy:
      type: object
      description: Bound and summarize messages produced by one run.
      default:
        max_messages: 20
        overflow: summary
      additionalProperties: false
      properties:
        max_messages:
          type: integer
          minimum: 1
          maximum: 100
        overflow:
          type: string
          enum:
            - summary
            - truncate
    risk_rules:
      type: array
      description: Optional OR-combined position trend and liquidation-buffer rules.
      default: []
      items:
        type: object
        additionalProperties: false
        properties:
          id:
            type: string
            pattern: ^[A-Za-z0-9_-]{1,64}$
          kind:
            type: string
            enum:
              - health_factor_drop
              - debt_growth
              - liquidation_buffer
          threshold_percent:
            type: number
            exclusiveMinimum: 0
          window_minutes:
            type: integer
            minimum: 1
            maximum: 1440
          min_debt_usd:
            type: number
            minimum: 0
        required:
          - id
          - kind
          - threshold_percent
      originalType: record[]
    user:
      type: string
      description: ''
      default: null
      originalType: string
  required:
    - inputs
    - user
    - default_threshold
