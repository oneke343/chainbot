summary: Simulate and execute veAERO votes
description: Revalidates the snapshot and NFT state, simulates each vote batch,
  and when an admin secret is configured, dry-run also signs locally and
  simulates the signed transaction without broadcasting. When dryRun is false,
  it broadcasts, confirms, and journals each transaction. The admin secret is
  the only signing secret read; the wrapper forwards only atomic
  VoteExecutor.voteMany operations; owner signing secrets are never read.
lock: '!inline f/aerodrome/scripts/voting/execute_votes.script.lock'
kind: script
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  properties:
    adminAddress:
      type: string
      description: Admin address bound in VoteExecutor; must match the address derived
        from adminVariablePath.
      default: ''
      originalType: string
    adminVariablePath:
      type: string
      description: Windmill Secret Variable path containing the admin private key;
        when set, dry-run signs locally for a final eth_call simulation but
        never broadcasts.
      default: ''
      originalType: string
    allocations:
      type: array
      description: Vote plans returned by optimize_votes, including token IDs, pool
        addresses, relative weights, and estimated rewards.
      default: null
      items:
        type: resource
        resourceType: allocation
      originalType: resource[]
    dryRun:
      type: boolean
      description: Simulate and report transactions without broadcasting when true; if
        adminVariablePath is set, also sign locally and simulate the signed
        transaction.
      default: true
    executorBatchSize:
      type: integer
      description: Maximum number of NFTs included in one atomic VoteExecutor.voteMany
        transaction; 1 uses a one-item voteMany call.
      default: null
      maximum: 50
      minimum: 1
    options:
      type: object
      description: Execution and policy options; must match the policy used to create
        the allocations.
      default: {}
      format: resource-partial
    rpcUrl:
      type: string
      description: Base JSON-RPC URL used for simulation, fee estimation, and
        transaction confirmation.
      default: https://base-rpc.publicnode.com
      originalType: string
    snapshot:
      type: object
      description: Execution metadata selected from collect_snapshot; used for
        freshness, epoch-end checks, and on-chain state rechecks.
      default: null
      format: resource-execution_snapshot
    voteExecutor:
      type: string
      description: Minimal-permission VoteExecutor address. The NFT owner must approve
        this address per tokenId in VotingEscrow before use.
      default: ''
      originalType: string
  required:
    - snapshot
    - allocations
