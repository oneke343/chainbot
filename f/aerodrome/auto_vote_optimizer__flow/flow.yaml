summary: 多 NFT veAERO 自动投票优化
description: 按地址发现 NFT，读取当周链上奖励和票数，联合优化、模拟并可选签名投票。默认 dry-run。
value:
  modules:
    - id: vote
      summary: Discover, collect, optimize and vote
      value:
        type: rawscript
        content: '!inline vote.ts'
        input_transforms:
          dryRun:
            type: javascript
            expr: flow_input.dryRun ?? true
          options:
            type: javascript
            expr: flow_input.options ?? {}
          rpcUrl:
            type: javascript
            expr: flow_input.rpcUrl ?? 'https://base-rpc.publicnode.com'
          signerVariablePaths:
            type: javascript
            expr: flow_input.signerVariablePaths ?? {}
          walletAddresses:
            type: javascript
            expr: flow_input.walletAddresses
        lock: '!inline vote.lock'
        language: bun
      timeout:
        type: static
        value: 1800
  concurrency_key: aerodrome-voting
  concurrent_limit: 1
schema:
  type: object
  properties:
    dryRun:
      type: boolean
      default: true
    options:
      type: object
      additionalProperties: false
      default: {}
      properties:
        deadlineBufferSeconds:
          type: integer
          default: 600
        dilution:
          type: number
          default: 1.15
          maximum: 10
          minimum: 1
        executionLeadSeconds:
          type: integer
          default: 7200
        maxGasUsd:
          type: number
          default: 2
          exclusiveMinimum: 0
        maxPools:
          type: integer
          default: 10
          maximum: 30
          minimum: 1
        maxShare:
          type: number
          default: 1
          exclusiveMinimum: 0
          maximum: 1
        maxSnapshotAgeSeconds:
          type: integer
          default: 900
        minNetUsd:
          type: number
          default: 0
          minimum: 0
        rewardHaircut:
          type: number
          default: 0.1
          exclusiveMaximum: 1
          minimum: 0
    rpcUrl:
      type: string
      default: https://base-rpc.publicnode.com
    signerVariablePaths:
      type: object
      additionalProperties:
        type: string
      description: Map owner address to Windmill secret variable path containing the
        signing key; never enter a key here
      default: {}
    walletAddresses:
      type: array
      description: Base owner addresses; discovers all directly owned veAERO NFTs
        automatically
      items:
        type: string
        pattern: ^0x[0-9a-fA-F]{40}$
      maxItems: 50
      minItems: 1
  required:
    - walletAddresses
