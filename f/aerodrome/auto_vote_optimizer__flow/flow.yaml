summary: 多 NFT veAERO 自动投票优化
description: 分阶段发现 NFT、读取固定区块快照、预筛候选池、联合优化、模拟并可选签名投票。启用 VoteExecutor 时可将多个 NFT 合并为原子 voteMany 交易；默认 dry-run。
value:
  modules:
    - id: collect
      summary: Discover veAERO NFTs and collect a fixed-block market snapshot
      value:
        type: script
        input_transforms:
          rpcUrl:
            type: javascript
            expr: flow_input.rpcUrl ?? 'https://base-rpc.publicnode.com'
          rpcChunkSize:
            type: javascript
            expr: flow_input.rpcChunkSize ?? 1000
          rpcConcurrency:
            type: javascript
            expr: flow_input.rpcConcurrency ?? 4
          poolViewAddress:
            type: javascript
            expr: flow_input.poolViewAddress
          poolViewPageSize:
            type: javascript
            expr: flow_input.poolViewPageSize ?? 100
          walletAddresses:
            type: javascript
            expr: flow_input.walletAddresses
        path: f/aerodrome/scripts/voting/collect_snapshot
      timeout:
        type: static
        value: 900
    - id: optimize
      summary: Filter candidate pools and optimize aggregate veAERO allocation
      value:
        type: script
        input_transforms:
          options:
            type: javascript
            expr: flow_input.options ?? {}
          snapshot:
            type: javascript
            expr: results.collect.snapshot
        path: f/aerodrome/scripts/voting/optimize_votes
      timeout:
        type: static
        value: 900
    - id: execute
      summary: Simulate and optionally sign, broadcast and confirm votes
      value:
        type: script
        input_transforms:
          allocations:
            type: javascript
            expr: results.optimize.allocations
          dryRun:
            type: javascript
            expr: flow_input.execution?.dryRun ?? true
          options:
            type: javascript
            expr: flow_input.options ?? {}
          rpcUrl:
            type: javascript
            expr: flow_input.rpcUrl ?? 'https://base-rpc.publicnode.com'
          voteExecutor:
            type: javascript
            expr: flow_input.execution?.voteExecutor ?? ''
          adminAddress:
            type: javascript
            expr: flow_input.execution?.adminAddress ?? ''
          adminVariablePath:
            type: javascript
            expr: flow_input.execution?.adminVariablePath ?? ''
          executorBatchSize:
            type: javascript
            expr: flow_input.execution?.executorBatchSize ?? 16
          snapshot:
            type: javascript
            expr: '({block: results.collect.snapshot.block, timestamp: results.collect.snapshot.timestamp, epoch: results.collect.snapshot.epoch, voteStart: results.collect.snapshot.voteStart, voteEnd: results.collect.snapshot.voteEnd})'
        path: f/aerodrome/scripts/voting/execute_votes
      timeout:
        type: static
        value: 1800
  concurrency_key: aerodrome-voting
  concurrent_limit: 1
schema:
  type: object
  properties:
    poolViewAddress:
      type: string
      description: 已部署的 AerodromePoolView 合约地址；由分页 view 一次返回活跃池、奖励和 token decimals。
      pattern: ^0x[0-9a-fA-F]{40}$
    poolViewPageSize:
      type: integer
      description: AerodromePoolView 每页扫描的 Voter 索引数量；默认 100，范围 10 到 100。
      default: 100
      minimum: 10
      maximum: 100
    execution:
      type: object
      description: 执行阶段配置；集中管理 dry-run、VoteExecutor、admin 和批量大小。
      additionalProperties: false
      properties:
        dryRun:
          type: boolean
          description: 先用 eth_simulateV1 模拟投票意图，再用 eth_fillTransaction 补齐交易字段；dry-run 会继续本地签名但不会广播，并报告 simulation gasUsed、filled gasLimit 和 Base 上限。为 false 时才会广播交易。
          default: true
        voteExecutor:
          type: string
          description: 必填的最小权限 VoteExecutor 合约地址。每个 NFT 必须先由 owner 在 VotingEscrow 上逐个 approve 此地址。
          pattern: ^0x[0-9a-fA-F]{40}$
        adminAddress:
          type: string
          description: 必填的 VoteExecutor admin 地址，必须与 admin Secret Variable 私钥推导出的地址一致。
          pattern: ^0x[0-9a-fA-F]{40}$
        adminVariablePath:
          type: string
          description: Windmill Secret Variable 路径，保存 VoteExecutor admin 私钥；输入中只能填写路径，不能填写私钥。配置后 dry-run 会读取并本地签名，但不会广播。
        executorBatchSize:
          type: integer
          description: 单笔原子 voteMany 交易包含的 NFT 数量，范围 1 到 50；批量交易任一 NFT 失败时整笔交易回退。
          default: 16
          minimum: 1
          maximum: 50
      required:
        - voteExecutor
        - adminAddress
        - adminVariablePath
    options:
      type: object
      description: 优化和候选池筛选参数；未填写项使用默认值。
      additionalProperties: false
      default: {}
      properties:
        candidateMinVotes:
          type: number
          description: 候选池扣除可移动本地旧票后的最低有效竞争票数（veAERO）；只有同时低于收益密度阈值时才会过滤。
          default: 0
          minimum: 0
        candidateMinRewardPerVoteUsd:
          type: number
          description: 候选池奖励除以外部及固定票数后的最低收益密度（USD/veAERO）。
          default: 0
          minimum: 0
        dilution:
          type: number
          description: 外部投票增长的保守倍数，用于降低对当前票数快照的过拟合。
          default: 1.15
          maximum: 10
          minimum: 1
        excludedPools:
          type: array
          description: 手动排除的池子地址列表；这些池子不会参与候选筛选、fallback 或最终投票分配。
          default: []
          items:
            type: string
            pattern: ^0x[0-9a-fA-F]{40}$
        maxShare:
          type: number
          description: 单个池子最多占全部可投 veAERO 的比例。
          default: 1
          exclusiveMinimum: 0
          maximum: 1
        maxSnapshotAgeSeconds:
          type: integer
          description: 执行阶段允许使用的快照最大年龄，超过后要求重新计算。
          default: 900
        minSelectedShare:
          type: number
          description: 最终选中池子的最低投票权比例；低于该比例的池子会被删除并重新优化，默认 0.5%。设置为 0 时仅按权重精度清理。
          default: 0.005
          minimum: 0
          maximum: 1
        rewardHaircut:
          type: number
          description: 对当前奖励估值应用的保守折扣比例。
          default: 0.1
          exclusiveMaximum: 1
          minimum: 0
    rpcUrl:
      type: string
      description: Base JSON-RPC URL；生产环境建议使用有配额和归档读取能力的节点。
      default: https://base-rpc.publicnode.com
    rpcChunkSize:
      type: integer
      description: 每个 Multicall 请求包含的最大合约读取数；默认 1000，允许范围 100 到 1000。较大值可减少往返次数，但可能超过 RPC 请求体限制。
      default: 1000
      minimum: 100
      maximum: 1000
    rpcConcurrency:
      type: integer
      description: 同时执行的 Multicall 请求数；默认 4，公共 RPC 限流时可降低。
      default: 4
      minimum: 1
      maximum: 8
    walletAddresses:
      type: array
      description: Base 链钱包地址；流程会自动发现这些地址直接持有的 veAERO NFT。
      items:
        type: string
        pattern: ^0x[0-9a-fA-F]{40}$
      maxItems: 50
      minItems: 1
  required:
    - poolViewAddress
    - walletAddresses
    - execution
