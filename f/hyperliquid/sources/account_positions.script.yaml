summary: Collect all Hyperliquid cross and isolated perpetual positions
description: Read-only discovery across all perpetual DEXs. Collection failures
  propagate to the caller.
lock: '!inline f/hyperliquid/sources/account_positions.script.lock'
kind: script
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  properties:
    address:
      type: string
      description: Actual account or subaccount address, not an agent wallet.
      pattern: ^0x[0-9a-fA-F]{40}$
    network:
      type: string
      default: mainnet
      enum:
        - mainnet
        - testnet
  required:
    - address
