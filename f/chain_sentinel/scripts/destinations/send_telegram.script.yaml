summary: Send alert messages to Telegram
description: Reusable batch Telegram destination for common monitor alert envelopes.
lock: '!inline f/chain_sentinel/scripts/destinations/send_telegram.script.lock'
kind: script
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  properties:
    auth:
      type: object
      default: null
      format: resource-telegram
    chat_id:
      type: string
      default: null
      originalType: string
    messages:
      type: array
      description: ''
      default: null
      items:
        type: resource
        resourceType: alert_message
      originalType: resource[]
  required:
    - auth
    - chat_id
