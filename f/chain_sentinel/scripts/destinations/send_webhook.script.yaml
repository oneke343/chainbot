summary: Send an alert to a webhook
description: Reusable JSON webhook destination for the common monitor alert envelope.
lock: '!inline f/chain_sentinel/scripts/destinations/send_webhook.script.lock'
kind: script
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  properties:
    connection:
      type: object
      default: null
      format: resource-http_connection
    message:
      type: object
      description: ''
      default: null
      format: resource-alert_message
      properties:
        description:
          type: string
          description: ''
          originalType: string
        fields:
          type: object
          description: ''
          format: resource-record
        severity:
          type: string
          description: ''
          enum:
            - info
            - warning
            - critical
          originalType: enum
        title:
          type: string
          description: ''
          originalType: string
      required:
        - title
        - description
        - severity
        - fields
    path:
      type: string
      default: null
      originalType: string
  required:
    - connection
    - path
