summary: Send alert messages to a webhook
description: Reusable batch JSON webhook destination for common monitor alert envelopes.
lock: '!inline f/chain_sentinel/scripts/destinations/send_webhook.script.lock'
kind: script
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  properties:
    connection:
      type: object
      default: null
      format: resource-http_connection
    messages:
      type: array
      description: ''
      default: null
      items:
        type: resource
        resourceType: alert_message
      originalType: resource[]
    path:
      type: string
      default: null
      originalType: string
  required:
    - connection
    - path
