schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  additionalProperties: false
  required:
    - matched
    - messages
    - fields
  properties:
    matched:
      type: boolean
      description: Whether this run produced alert candidates for AlertPolicy.
    messages:
      type: array
      description: Alert candidates produced by the Rule during this run.
      items:
        type: object
        additionalProperties: false
        required:
          - title
          - description
        properties:
          title:
            type: string
            minLength: 1
          description:
            type: string
            minLength: 1
          fields:
            type: object
            additionalProperties: true
    fields:
      type: object
      additionalProperties: true
      description: Structured values passed to AlertPolicy and Destinations.
description: Public output returned by a Monitor Rule.
