name: spark_lend
description: SparkLend markets and RPC connections used for read-only position monitoring.
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  additionalProperties: false
  properties:
    markets:
      type: array
      minItems: 1
      items:
        type: object
        additionalProperties: false
        properties:
          name:
            type: string
            minLength: 1
          chain_id:
            type: integer
            minimum: 1
          chain_name:
            type: string
            minLength: 1
          pool_address:
            type: string
            pattern: ^0x[0-9a-fA-F]{40}$
          rpc_url:
            type: string
            format: uri
          rpc_headers:
            type: object
            additionalProperties:
              type: string
          base_currency_decimals:
            type: integer
            minimum: 0
            maximum: 36
            default: 8
        required:
          - name
          - chain_id
          - chain_name
          - pool_address
          - rpc_url
  required:
    - markets
