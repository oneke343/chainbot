summary: Aave V4 asset cap and market risk
description: Monitor individual reserve cap usage and supply/borrow cap changes. The
  first successful observation establishes the cap baseline without a change alert.
value:
  modules:
    - id: source
      value:
        type: script
        path: f/aave/scripts/sources/aave_v4_market_risk
        input_transforms:
          api: {type: javascript, expr: flow_input.api}
          chain_ids: {type: javascript, expr: flow_input.chain_ids}
    - id: rules
      value:
        type: script
        path: f/aave/scripts/rules/evaluate_aave_v4_market_risk
        input_transforms:
          inputs: {type: javascript, expr: results.source}
          default_rules: {type: javascript, expr: 'flow_input.default_rules ?? {}'}
          market_rules: {type: javascript, expr: 'flow_input.market_rules ?? {}'}
          spoke_ids: {type: javascript, expr: 'flow_input.spoke_ids ?? []'}
          reserve_ids: {type: javascript, expr: 'flow_input.reserve_ids ?? []'}
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  order: [api, chain_ids, spoke_ids, reserve_ids, default_rules, market_rules]
  properties:
    api: {type: object, format: resource-graphql, default: '$res:f/aave/resources/aave_v4'}
    chain_ids:
      type: array
      minItems: 1
      uniqueItems: true
      items: {type: integer, minimum: 1}
    spoke_ids:
      type: array
      default: []
      uniqueItems: true
      items: {type: string, minLength: 1}
      description: Optional Aave Spoke IDs. Empty selects all Spokes on the requested chains.
    reserve_ids:
      type: array
      default: []
      uniqueItems: true
      items: {type: string, minLength: 1}
      description: Optional reserve IDs within the selected Spokes. Empty selects all assets.
    default_rules:
      $ref: '#/$defs/rules'
    market_rules:
      type: object
      description: Override thresholds by reserve ID or full chain / hub / spoke / asset name.
      additionalProperties:
        $ref: '#/$defs/rules'
  required: [api, chain_ids]
  $defs:
    rules:
      type: object
      additionalProperties: false
      properties:
        min_liquidity_usd: {type: number, minimum: 0}
        max_utilization_percent: {type: number, minimum: 0}
        max_supply_cap_used_percent: {type: number, minimum: 0}
        max_borrow_cap_used_percent: {type: number, minimum: 0}
        alert_paused: {type: boolean}
        alert_oracle_warnings: {type: boolean}
