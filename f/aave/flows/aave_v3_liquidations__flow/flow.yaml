summary: Aave V3 liquidation events
description: Query and deduplicate Aave V3 user liquidation events.
value:
  modules:
    - id: source
      value:
        type: script
        path: f/aave/scripts/sources/aave_v3_user_liquidations
        input_transforms:
          api: {type: javascript, expr: flow_input.api}
          user: {type: javascript, expr: flow_input.user}
          market: {type: javascript, expr: flow_input.market}
          chain_id: {type: javascript, expr: flow_input.chain_id}
    - id: rules
      value:
        type: script
        path: f/aave/scripts/rules/evaluate_aave_v3_liquidations
        input_transforms:
          inputs: {type: javascript, expr: results.source}
          user: {type: javascript, expr: flow_input.user}
          market: {type: javascript, expr: flow_input.market}
          market_name: {type: javascript, expr: flow_input.market_name}
          chain_id: {type: javascript, expr: flow_input.chain_id}
          notify_on_first_run: {type: javascript, expr: flow_input.notify_on_first_run ?? false}
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  order: [api, user, chain_id, market, market_name, notify_on_first_run]
  properties:
    api: {type: object, format: resource-graphql, default: '$res:f/aave/resources/aave_v3'}
    user: {type: string, pattern: '^0x[0-9a-fA-F]{40}$'}
    chain_id: {type: integer, minimum: 1}
    market: {type: string, pattern: '^0x[0-9a-fA-F]{40}$'}
    market_name: {type: string, minLength: 1}
    notify_on_first_run: {type: boolean, default: false}
  required: [api, user, chain_id, market, market_name]
