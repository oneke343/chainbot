summary: Aave V3 market risk
description: Monitor Aave V3 liquidity utilization caps and reserve status.
value:
  modules:
    - id: source
      value:
        type: script
        path: f/aave/scripts/sources/aave_v3_market_risk
        input_transforms:
          api: {type: javascript, expr: flow_input.api}
          chain_ids: {type: javascript, expr: flow_input.chain_ids}
    - id: rules
      value:
        type: script
        path: f/aave/scripts/rules/evaluate_aave_v3_market_risk
        input_transforms:
          inputs: {type: javascript, expr: results.source}
          default_rules: {type: javascript, expr: 'flow_input.default_rules ?? {}'}
          market_rules: {type: javascript, expr: 'flow_input.market_rules ?? {}'}
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  order: [api, chain_ids, default_rules, market_rules]
  properties:
    api: {type: object, format: resource-graphql, default: '$res:f/aave/resources/aave_v3'}
    chain_ids:
      type: array
      minItems: 1
      uniqueItems: true
      items: {type: integer, minimum: 1}
    default_rules:
      $ref: '#/$defs/rules'
    market_rules:
      type: object
      additionalProperties:
        $ref: '#/$defs/rules'
  required: [api, chain_ids]
  $defs:
    rules:
      type: object
      additionalProperties: false
      properties:
        min_liquidity_usd: {type: number, minimum: 0}
        max_utilization_percent: {type: number, minimum: 0}
        max_supply_cap_used_percent: {type: number, minimum: 0}
        max_borrow_cap_used_percent: {type: number, minimum: 0}
        alert_oracle_warnings: {type: boolean, default: true}
        alert_paused: {type: boolean, default: true}
