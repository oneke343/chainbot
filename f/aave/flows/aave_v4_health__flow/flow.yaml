summary: Aave V4 用户仓位 HF 监控
description: Discover mainnets and query Spoke positions using two native GraphQL Scripts,
  then evaluate thresholds and persist MonitorState in the Rule.
value:
  modules:
    - id: networks
      value:
        type: script
        path: f/aave/scripts/sources/aave_v4_chains
        input_transforms:
          api:
            type: javascript
            expr: flow_input.api
      retry:
        constant: {attempts: 2, seconds: 2}
      timeout: {type: static, value: 30}
    - id: sources
      value:
        type: script
        input_transforms:
          api:
            type: javascript
            expr: flow_input.api
          chain_ids:
            type: javascript
            expr: 'flow_input.chain_ids?.length ? flow_input.chain_ids : results.networks.chains.map(chain => chain.chainId)'
          user:
            type: javascript
            expr: flow_input.user
        path: f/aave/scripts/sources/aave_v4_user_positions
      retry:
        constant:
          attempts: 2
          seconds: 2
      timeout:
        type: static
        value: 120
    - id: rules
      value:
        type: script
        input_transforms:
          default_threshold:
            type: javascript
            expr: flow_input.default_threshold
          inputs:
            type: javascript
            expr: '({chains: results.networks.chains, userPositions: results.sources.userPositions})'
          user:
            type: javascript
            expr: flow_input.user
          chain_ids:
            type: javascript
            expr: flow_input.chain_ids ?? []
          market_thresholds:
            type: javascript
            expr: flow_input.market_thresholds ?? {}
        path: f/aave/scripts/rules/evaluate_aave_v4_health
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  order:
    - api
    - user
    - default_threshold
    - market_thresholds
    - chain_ids
  properties:
    api:
      type: object
      default: $res:f/aave/resources/aave_v4
      format: resource-graphql
    chain_ids:
      type: array
      description: Empty discovers all API-supported mainnets. Unsupported IDs fail.
      default: []
      items:
        type: integer
        minimum: 1
      uniqueItems: true
    default_threshold:
      type: number
      description: HF below this value matches unless the market has an override.
      exclusiveMinimum: 0
    market_thresholds:
      type: object
      additionalProperties:
        type: number
        exclusiveMinimum: 0
      description: 'Keys from fields.positions: market_name (Ethereum / Main), or name
        for an exact Spoke. Unknown keys are reported in unused_thresholds.'
      default: {}
    user:
      type: string
      pattern: ^0x[0-9a-fA-F]{40}$
  required:
    - api
    - user
    - default_threshold
