summary: Run the Aave health-factor monitor
description: Query Aave positions, evaluate configured health-factor thresholds,
  persist the Root Flow MonitorState, and return MonitorOutput.
value:
  modules:
    - id: fetch_positions
      summary: Query the user's Aave market positions
      value:
        type: script
        input_transforms:
          api:
            type: javascript
            expr: flow_input.aave_api
          chainIds:
            type: javascript
            expr: flow_input.chain_ids ?? [1, 10, 137, 42161, 8453]
          user:
            type: javascript
            expr: flow_input.user
        path: f/aave/scripts/sources/aave_market_positions
      retry:
        exponential:
          attempts: 3
          multiplier: 2
          random_factor: 20
          seconds: 2
      timeout:
        type: static
        value: 30
    - id: evaluate_and_persist
      summary: Evaluate the Rule and persist the next MonitorState
      value:
        type: script
        input_transforms:
          inputs:
            type: javascript
            expr: >-
              ({
                aave_market_positions: results.fetch_positions?.data ?? results.fetch_positions
              })
          market_thresholds:
            type: javascript
            expr: flow_input.market_thresholds
          default_threshold:
            type: javascript
            expr: flow_input.default_threshold
          risk_rules:
            type: javascript
            expr: flow_input.risk_rules ?? []
          stress_rules:
            type: javascript
            expr: flow_input.stress_rules ?? []
          risk_options:
            type: javascript
            expr: flow_input.risk_options ?? {}
          message_policy:
            type: javascript
            expr: flow_input.message_policy ?? {}
          user:
            type: javascript
            expr: flow_input.user
        path: f/aave/scripts/rules/evaluate_aave_health
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  order:
    - aave_api
    - user
    - chain_ids
    - market_thresholds
    - risk_rules
    - stress_rules
    - risk_options
    - message_policy
  properties:
    aave_api:
      type: object
      description: Aave GraphQL Resource.
      format: resource-graphql
    chain_ids:
      type: array
      default:
        - 1
        - 10
        - 137
        - 42161
        - 8453
      items:
        type: integer
    market_thresholds:
      type: object
      additionalProperties:
        oneOf:
          - type: string
          - type: number
      description: Health-factor threshold keyed by Aave market name.
    default_threshold:
      type: number
      exclusiveMinimum: 0
      description: Optional fallback HF threshold. Omit to monitor only explicitly configured markets.
    risk_rules:
      type: array
      default: []
      items:
        $ref: '#/$defs/risk_rule'
    stress_rules:
      type: array
      default: []
      items: {$ref: '#/$defs/stress_rule'}
    risk_options:
      $ref: '#/$defs/risk_options'
      default: {rearm_health_factor_margin: 0.05, repeat_interval_minutes: 60}
    message_policy:
      $ref: '#/$defs/message_policy'
      default: {max_messages: 20, overflow: summary}
    user:
      type: string
      description: Monitored EVM address.
  required:
    - aave_api
    - user
    - market_thresholds
  $defs:
    risk_rule:
      type: object
      additionalProperties: false
      properties:
        id: {type: string, pattern: '^[A-Za-z0-9_-]{1,64}$'}
        kind: {type: string, enum: [health_factor_drop, debt_growth, liquidation_buffer]}
        threshold_percent: {type: number, exclusiveMinimum: 0}
        window_minutes: {type: integer, minimum: 1, maximum: 1440}
        min_debt_usd: {type: number, minimum: 0}
        rearm_percent: {type: number, minimum: 0}
      required: [id, kind, threshold_percent]
    stress_rule:
      type: object
      additionalProperties: false
      properties:
        id: {type: string, pattern: '^[A-Za-z0-9_-]{1,64}$'}
        collateral_change_percent: {type: number, exclusiveMinimum: -100}
        debt_change_percent: {type: number, exclusiveMinimum: -100, default: 0}
        threshold: {type: number, exclusiveMinimum: 0}
        min_debt_usd: {type: number, minimum: 0}
      required: [id, collateral_change_percent, threshold]
    risk_options:
      type: object
      additionalProperties: false
      properties:
        rearm_health_factor_margin: {type: number, minimum: 0, default: 0.05}
        repeat_interval_minutes: {type: number, minimum: 0, default: 60}
    message_policy:
      type: object
      additionalProperties: false
      properties:
        max_messages: {type: integer, minimum: 1, maximum: 100, default: 20}
        overflow: {type: string, enum: [summary, truncate], default: summary}
