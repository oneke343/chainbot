summary: Query Aave V3 user liquidation calls
lock: ''
kind: script
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  properties:
    api: {type: object, format: resource-graphql}
    user: {type: string, pattern: '^0x[0-9a-fA-F]{40}$'}
    market: {type: string, pattern: '^0x[0-9a-fA-F]{40}$'}
    chain_id: {type: integer, minimum: 1}
  required: [api, user, market, chain_id]
