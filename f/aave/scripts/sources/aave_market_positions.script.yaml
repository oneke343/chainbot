summary: Query Aave market positions
description: Returns one user's position state for Aave markets on selected chains.
lock: ''
kind: script
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  properties:
    api:
      type: object
      description: Aave GraphQL connection.
      format: resource-graphql
    chainIds:
      type: array
      description: Aave deployment chain IDs to query.
      default: null
      items:
        type: integer
      originalType: record[]
    user:
      type: object
      description: EVM account address.
      default: null
      pattern: ^0x[0-9a-fA-F]{40}$
      properties: {}
  required:
    - api
    - user
    - chainIds
