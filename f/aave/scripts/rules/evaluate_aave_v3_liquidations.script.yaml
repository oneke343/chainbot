summary: Deduplicate Aave V3 liquidation calls and save MonitorState
description: ''
lock: '!inline f/aave/scripts/rules/evaluate_aave_v3_liquidations.script.lock'
kind: script
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  properties:
    chain_id:
      type: number
      default: null
      minimum: 1
    inputs:
      type: object
      default: null
      format: resource-result
      properties:
        userTransactionHistory:
          type: object
          description: ''
          properties:
            items:
              type: object
              description: ''
              format: resource-array
            pageInfo:
              type: object
              description: ''
              properties:
                next:
                  type: string
                  description: ''
                  originalType: string
    market:
      type: string
      default: null
      originalType: string
      pattern: ^0x[0-9a-fA-F]{40}$
    market_name:
      type: string
      default: null
      minLength: 1
      originalType: string
    notify_on_first_run:
      type: boolean
      default: false
    user:
      type: string
      default: null
      originalType: string
      pattern: ^0x[0-9a-fA-F]{40}$
  required:
    - inputs
    - user
    - chain_id
    - market
    - market_name
