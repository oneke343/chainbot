summary: Deduplicate Aave V3 liquidation calls and save MonitorState
description: ''
lock: '!inline f/aave/scripts/rules/evaluate_aave_v3_liquidations.script.lock'
kind: script
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  properties:
    chain_id:
      type: integer
      minimum: 1
    inputs:
      type: object
      format: resource-record
    market:
      type: string
      pattern: ^0x[0-9a-fA-F]{40}$
    market_name:
      type: string
      minLength: 1
    notify_on_first_run:
      type: boolean
      default: false
    user:
      type: string
      pattern: ^0x[0-9a-fA-F]{40}$
  required:
    - inputs
    - user
    - chain_id
    - market
    - market_name
