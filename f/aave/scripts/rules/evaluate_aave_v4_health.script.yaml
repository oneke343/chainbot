summary: Evaluate Aave V4 health-factor thresholds and save MonitorState
description: Per-market threshold overrides with a default for all remaining
  borrowing positions.
lock: '!inline f/aave/scripts/rules/evaluate_aave_v4_health.script.lock'
kind: script
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  properties:
    chain_ids:
      type: array
      description: ''
      default: []
      items:
        type: number
      originalType: number[]
    default_threshold:
      type: number
      description: Default HF threshold for markets without an override.
      default: null
      exclusiveMinimum: 0
    inputs:
      type: object
      description: Combined GraphQL Source results containing chains and userPositions.
      default: null
      format: resource-record
    market_thresholds:
      type: object
      additionalProperties:
        type: number
        exclusiveMinimum: 0
      description: ''
      default: {}
      format: resource-record
    message_policy:
      type: object
      description: Bound and summarize messages produced by one run.
      default:
        max_messages: 20
        overflow: summary
      additionalProperties: false
      properties:
        max_messages:
          type: integer
          minimum: 1
          maximum: 100
        overflow:
          type: string
          enum:
            - summary
            - truncate
    risk_rules:
      type: array
      description: Optional OR-combined position trend and liquidation-buffer rules.
      default: []
      items:
        type: object
        additionalProperties: false
        properties:
          id:
            type: string
            pattern: ^[A-Za-z0-9_-]{1,64}$
          kind:
            type: string
            enum:
              - health_factor_drop
              - debt_growth
              - liquidation_buffer
          threshold_percent:
            type: number
            exclusiveMinimum: 0
          window_minutes:
            type: integer
            minimum: 1
            maximum: 1440
          min_debt_usd:
            type: number
            minimum: 0
        required:
          - id
          - kind
          - threshold_percent
      originalType: record[]
    user:
      type: string
      description: ''
      default: null
      originalType: string
      pattern: ^0x[0-9a-fA-F]{40}$
  required:
    - inputs
    - user
    - default_threshold
