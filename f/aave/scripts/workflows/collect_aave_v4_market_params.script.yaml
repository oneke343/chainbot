summary: Collect Aave V4 market params
description: Query Hubs through native GraphQL, read networks in parallel through
  multicall at latest, and return Reader-shaped snapshots.
lock: '!inline f/aave/scripts/workflows/collect_aave_v4_market_params.script.lock'
kind: script
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  properties:
    api:
      type: object
      default: null
      format: resource-graphql
    rpc_urls:
      type: object
      additionalProperties:
        type: string
      description: Static map of chain ID to RPC URL
      default: null
  required:
    - api
    - rpc_urls
