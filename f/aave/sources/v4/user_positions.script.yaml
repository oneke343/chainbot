summary: Discover Aave V4 user positions across networks
description: Native GraphQL query for every Spoke position on explicitly selected networks.
lock: ''
kind: script
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  properties:
    api:
      type: object
      description: ''
      format: resource-graphql
    chain_ids:
      type: array
      description: Non-empty chain IDs, obtained from chains or supplied explicitly.
      default: null
      items:
        type: integer
      minItems: 1
      originalType: record[]
    user:
      type: object
      description: ''
      default: null
      originalType: string
      pattern: ^0x[0-9a-fA-F]{40}$
      properties: {}
  required:
    - api
    - user
    - chain_ids
