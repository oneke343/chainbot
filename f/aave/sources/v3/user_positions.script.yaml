summary: Query Aave V3 user positions
description: Native GraphQL query for user positions on the selected networks.
lock: ''
kind: script
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  properties:
    api:
      type: object
      format: resource-graphql
    user:
      type: string
      pattern: ^0x[0-9a-fA-F]{40}$
    chainIds:
      type: array
      items:
        type: integer
      minItems: 1
  required:
    - api
    - user
    - chainIds
