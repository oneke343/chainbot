summary: Query Aave V3 market configuration
description: Fetch configuration for all selected chains in one native GraphQL query.
lock: ''
kind: script
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  properties:
    api:
      type: object
      format: resource-graphql
    chain_ids:
      type: array
      default: null
      items:
        type: integer
      minItems: 1
      originalType: record[]
  required:
    - api
    - chain_ids
