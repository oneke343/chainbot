summary: Query Aave V3 reserve metrics
description: Read balances, liquidity, utilization, borrow APY and caps for all
  selected chains.
lock: ""
kind: script
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  properties:
    api:
      type: object
      format: resource-graphql
    chain_ids:
      type: array
      items:
        type: integer
      minItems: 1
  required:
    - api
    - chain_ids
