summary: Evaluate Aave V3 reserve risk metrics
description: Evaluate 15-minute liquidity, borrow APY and balance changes.
lock: '!inline f/aave/rules/aave_v3_market_risk.script.lock'
kind: script
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  properties:
    config:
      type: object
      default: null
      format: resource-risk_config
      properties:
        defaults:
          type: object
          format: resource-risk_thresholds
          properties:
            borrowApyRiseBps:
              type: number
              description: Borrow APY increase; 200 = 2 percentage points.
            borrowGrowthBps:
              type: number
              description: Borrow increase; 1000 = 10%. No amount floor.
            liquidityChangeBps:
              type: number
              description: Liquidity change in either direction; 2000 = 20%.
            supplyDropBps:
              type: number
              description: Supply decrease; 1000 = 10%. No amount floor.
          required:
            - liquidityChangeBps
            - borrowApyRiseBps
            - supplyDropBps
            - borrowGrowthBps
        overrides:
          type: object
          additionalProperties:
            type: object
            properties:
              borrowApyRiseBps:
                type: integer
                description: Borrow APY increase; 200 = 2 percentage points.
              borrowGrowthBps:
                type: integer
                description: Borrow increase; 1000 = 10%. No amount floor.
              liquidityChangeBps:
                type: integer
                description: Liquidity change in either direction; 2000 = 20%.
              supplyDropBps:
                type: integer
                description: Supply decrease; 1000 = 10%. No amount floor.
          description: Overrides keyed by chainId/lowercase-market/lowercase-asset.
          format: resource-record
      required:
        - defaults
        - overrides
    current:
      type: object
      default: null
      format: resource-reserve_snapshot
      properties:
        reserves:
          type: object
          additionalProperties:
            type: object
        sampledAt:
          type: string
          format: date-time
      required:
        - sampledAt
        - reserves
    history:
      type: array
      default: null
      items:
        type: resource
        resourceType: reserve_snapshot
      originalType: resource[]
  required:
    - current
    - history
