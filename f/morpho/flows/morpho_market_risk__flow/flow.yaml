summary: Morpho market risk
description: Monitor Morpho oracle warnings bad debt and liquidity.
value:
  modules:
    - id: source
      value:
        type: script
        path: f/morpho/scripts/sources/morpho_market_risk
        input_transforms:
          api: {type: javascript, expr: flow_input.api}
          market_ids: {type: javascript, expr: flow_input.market_ids}
          chain_ids: {type: javascript, expr: 'flow_input.chain_ids?.length ? flow_input.chain_ids : null'}
    - id: rules
      value:
        type: script
        path: f/morpho/scripts/rules/evaluate_morpho_market_risk
        input_transforms:
          inputs: {type: javascript, expr: results.source}
          market_ids: {type: javascript, expr: flow_input.market_ids}
          default_rules: {type: javascript, expr: 'flow_input.default_rules ?? {}'}
          market_rules: {type: javascript, expr: 'flow_input.market_rules ?? {}'}
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  order: [api, market_ids, chain_ids, default_rules, market_rules]
  properties:
    api: {type: object, format: resource-graphql, default: '$res:f/morpho/resources/morpho'}
    market_ids:
      type: array
      minItems: 1
      uniqueItems: true
      items: {type: string, pattern: '^0x[0-9a-fA-F]{64}$'}
    chain_ids:
      type: array
      default: []
      uniqueItems: true
      items: {type: integer, minimum: 1}
    default_rules:
      $ref: '#/$defs/rules'
    market_rules:
      type: object
      additionalProperties:
        $ref: '#/$defs/rules'
  required: [api, market_ids]
  $defs:
    rules:
      type: object
      additionalProperties: false
      properties:
        min_liquidity_usd: {type: number, minimum: 0}
        max_utilization_percent: {type: number, minimum: 0}
        max_bad_debt_usd: {type: number, minimum: 0, default: 0}
        alert_oracle_warnings: {type: boolean, default: true}
