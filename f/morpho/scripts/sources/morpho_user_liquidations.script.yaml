summary: Query Morpho user liquidation transactions
description: ''
lock: ''
kind: script
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  properties:
    api:
      type: object
      format: resource-graphql
    chain_ids:
      type: array
      items:
