summary: Query Morpho user liquidation transactions
lock: ''
kind: script
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  properties:
    api: {type: object, format: resource-graphql}
    user: {type: string, pattern: '^0x[0-9a-fA-F]{40}$'}
    chain_ids:
      type: array
      items: {type: integer, minimum: 1}
  required: [api, user]
