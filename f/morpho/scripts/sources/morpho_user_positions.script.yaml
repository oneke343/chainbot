summary: Query up to 1000 Morpho Blue user borrowing positions
description: One native GraphQL query. Rule must verify pageInfo before
  evaluating or saving state.
lock: ''
kind: script
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  properties:
    api:
      type: object
      description: ''
      format: resource-graphql
    chain_ids:
      type: array
      description: Null means all networks. A non-empty list restricts the query.
      default: null
      items:
        type: integer
        minimum: 1
      originalType: number[]
    user:
      type: string
      description: ''
      default: null
      originalType: string
      pattern: ^0x[0-9a-fA-F]{40}$
  required:
    - api
    - user
