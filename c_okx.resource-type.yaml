description: OKX API endpoint and HMAC credentials.
format_extension: null
is_fileset: false
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  properties:
    api_key:
      type: string
      password: true
    api_secret:
      type: string
      password: true
    passphrase:
      type: string
      password: true
    url:
      type: string
      description: API base URL for the account's region.
      default: https://openapi.okx.com
      format: uri
  required:
    - url
    - api_key
    - api_secret
    - passphrase
