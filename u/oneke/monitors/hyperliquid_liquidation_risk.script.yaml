summary: Monitor Hyperliquid account liquidation risk
description: Collect all perpetual positions, evaluate liquidation risk, and
  route breach or unknown findings through the existing notification channel.
  Active findings notify each run.
lock: '!inline u/oneke/monitors/hyperliquid_liquidation_risk.script.lock'
kind: script
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  properties:
    address:
      type: string
      description: Actual account or subaccount address, not an agent wallet.
      default: null
      originalType: string
      pattern: ^0x[0-9a-fA-F]{40}$
    config:
      type: object
      additionalProperties: false
      default: null
      format: resource-config
      properties:
        maxMarginRiskRatio:
          type: string
          description: Alert when maintenance-to-equity ratio is at or above this fraction.
          pattern: ^0\.\d+$
        maxSnapshotAgeMs:
          type: integer
          minimum: 1
        minLiquidationDistance:
          type: string
          description: Alert when liquidation distance is at or below this fraction.
          pattern: ^0\.\d+$
      required:
        - minLiquidationDistance
        - maxMarginRiskRatio
        - maxSnapshotAgeMs
    network:
      type: string
      default: mainnet
      enum:
        - mainnet
        - testnet
      originalType: enum
  required:
    - address
    - config
