summary: Monitor Hyperliquid account liquidation risk
description: Collect all perpetual positions, evaluate liquidation risk, and route breach or unknown findings through the existing notification channel. Active findings notify each run.
lock: '!inline u/oneke/monitors/hyperliquid_liquidation_risk.script.lock'
kind: script
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  properties:
    address:
      type: string
      pattern: ^0x[0-9a-fA-F]{40}$
      description: Actual account or subaccount address, not an agent wallet.
    config:
      type: object
      additionalProperties: false
      properties:
        minLiquidationDistance:
          type: string
          pattern: ^0\.\d+$
          description: Alert when liquidation distance is at or below this fraction.
        maxMarginRiskRatio:
          type: string
          pattern: ^0\.\d+$
          description: Alert when maintenance-to-equity ratio is at or above this fraction.
        maxSnapshotAgeMs:
          type: integer
          minimum: 1
      required:
        - minLiquidationDistance
        - maxMarginRiskRatio
        - maxSnapshotAgeMs
    network:
      type: string
      enum: [mainnet, testnet]
      default: mainnet
  required:
    - address
    - config
