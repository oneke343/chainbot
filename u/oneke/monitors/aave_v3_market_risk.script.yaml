summary: Monitor Aave V3 reserve risks
description: Collect ReserveSnapshot, evaluate successful Source history and
  notify per reserve. Active conditions notify each run.
lock: "!inline u/oneke/monitors/aave_v3_market_risk.script.lock"
kind: script
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  properties:
    config:
      type: object
      default:
        defaults:
          liquidityChangeBps: 2000
          utilizationBufferBps: 200
          borrowApyRiseBps: 200
          supplyDropBps: 1000
          borrowGrowthBps: 1000
          capUsageBps: 9500
        overrides: {}
      properties:
        defaults:
          type: object
          properties: &a1
            liquidityChangeBps:
              type: integer
              description: Liquidity change in either direction; 2000 = 20%.
            utilizationBufferBps:
              type: integer
              description: Buffer above each sample's kink; 200 = 2 percentage points.
            borrowApyRiseBps:
              type: integer
              description: Borrow APY increase; 200 = 2 percentage points.
            supplyDropBps:
              type: integer
              description: Supply decrease; 1000 = 10%. No amount floor.
            borrowGrowthBps:
              type: integer
              description: Borrow increase; 1000 = 10%. No amount floor.
            capUsageBps:
              type: integer
              description: Supply and borrow cap usage; 9500 = 95%.
          required:
            - liquidityChangeBps
            - utilizationBufferBps
            - borrowApyRiseBps
            - supplyDropBps
            - borrowGrowthBps
            - capUsageBps
        overrides:
          type: object
          description: Overrides keyed by chainId/lowercase-market/lowercase-asset.
          additionalProperties:
            type: object
            properties: *a1
      required:
        - defaults
        - overrides
  required: []
