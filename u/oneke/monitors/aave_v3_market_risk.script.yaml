summary: Monitor Aave V3 reserve risks
description: Collect ReserveSnapshot, evaluate successful Source history and
  notify per reserve. Active conditions notify each run.
lock: '!inline u/oneke/monitors/aave_v3_market_risk.script.lock'
kind: script
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  properties:
    config:
      type: object
      default: null
      format: resource-risk_config
      properties:
        defaults:
          type: object
          properties:
            borrowApyRiseBps:
              type: integer
              description: Borrow APY increase; 200 = 2 percentage points.
            borrowGrowthBps:
              type: integer
              description: Borrow increase; 1000 = 10%. No amount floor.
            liquidityChangeBps:
              type: integer
              description: Liquidity change in either direction; 2000 = 20%.
            supplyDropBps:
              type: integer
              description: Supply decrease; 1000 = 10%. No amount floor.
            utilizationBufferBps:
              type: integer
              description: Buffer above each sample's kink; 200 = 2 percentage points.
          required:
            - liquidityChangeBps
            - utilizationBufferBps
            - borrowApyRiseBps
            - supplyDropBps
            - borrowGrowthBps
        overrides:
          type: object
          additionalProperties:
            type: object
            properties:
              borrowApyRiseBps:
                type: integer
                description: Borrow APY increase; 200 = 2 percentage points.
              borrowGrowthBps:
                type: integer
                description: Borrow increase; 1000 = 10%. No amount floor.
              liquidityChangeBps:
                type: integer
                description: Liquidity change in either direction; 2000 = 20%.
              supplyDropBps:
                type: integer
                description: Supply decrease; 1000 = 10%. No amount floor.
              utilizationBufferBps:
                type: integer
                description: Buffer above each sample's kink; 200 = 2 percentage points.
          description: Overrides keyed by chainId/lowercase-market/lowercase-asset.
      required:
        - defaults
        - overrides
  required: []
