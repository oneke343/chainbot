summary: Check Aave V4 market params changes every minute
description: Monitor Hub assets, registered Spoke caps, reserve configuration
  history, liquidation, permissions and supported proxy configuration. First
  observation establishes a silent baseline.
args:
  api: $res:f/aave/resources/aave_v4
  rpc_urls:
    '1': https://ethereum-rpc.publicnode.com
    '43114': https://api.avax.network/ext/bc/C/rpc
    '5042': https://rpc.quicknode.mainnet.arc.io
    '8453': https://mainnet.base.org
  severity: info
  spoke_ids: []
  telegram_auth: $res:u/oneke/yeap-bot
  telegram_chat_id: '-1004252768572'
cron_version: v2
enabled: false
is_flow: true
no_flow_overlap: true
schedule: 0 */1 * * * *
script_path: u/oneke/aave_v4_market_params_monitor
timezone: Asia/Shanghai
ws_error_handler_muted: false
