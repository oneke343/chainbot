summary: Check Morpho health factors every minute
description: Monitor every Morpho network for the configured user and send warning alerts to Telegram and FlashDuty.
schedule: '0 */1 * * * *'
timezone: Asia/Shanghai
cron_version: v2
enabled: true
is_flow: true
script_path: u/oneke/0x166Ce42Df5f4BAA94aBC5B62C60dab1B3C73D2a3/morpho_hf_monitor
args:
  api: $res:f/morpho/resources/morpho
  user: '0x166Ce42Df5f4BAA94aBC5B62C60dab1B3C73D2a3'
  default_threshold: 1.15
  market_thresholds: {}
  chain_ids: []
  risk_rules:
    - {id: hf_drop_5m, kind: health_factor_drop, window_minutes: 5, threshold_percent: 10, rearm_percent: 5}
    - {id: hf_drop_30m, kind: health_factor_drop, window_minutes: 30, threshold_percent: 20, rearm_percent: 10}
    - {id: debt_up_5m, kind: debt_growth, window_minutes: 5, threshold_percent: 20, rearm_percent: 10}
    - {id: debt_up_30m, kind: debt_growth, window_minutes: 30, threshold_percent: 40, rearm_percent: 20}
    - {id: debt_up_60m, kind: debt_growth, window_minutes: 60, threshold_percent: 60, rearm_percent: 30}
  stress_rules:
    - {id: collateral_down_10, collateral_change_percent: -10, debt_change_percent: 0, threshold: 1.05}
  risk_options: {rearm_health_factor_margin: 0.05, repeat_interval_minutes: 60}
  message_policy: {max_messages: 20, overflow: summary}
  severity: warning
  telegram_auth: $res:u/oneke/yeap-bot
  telegram_chat_id: '-1004252768572'
  flashduty_enabled: true
  flashduty_destination: $res:u/oneke/flashcat
  flashduty_alert_key: ''
no_flow_overlap: true
ws_error_handler_muted: false
