summary: Check Morpho health factors every minute
description: Monitor every Morpho network for the configured user and send
  warning alerts to Telegram and FlashDuty.
args:
  api: $res:f/morpho/resources/morpho
  chain_ids: []
  default_threshold: 1.15
  flashduty_alert_key: ''
  flashduty_destination: $res:u/oneke/flashcat
  flashduty_enabled: true
  market_thresholds: {}
  message_policy:
    max_messages: 20
    overflow: summary
  risk_options:
    rearm_health_factor_margin: 0.05
    repeat_interval_minutes: 60
  risk_rules:
    - id: hf_drop_5m
      kind: health_factor_drop
      rearm_percent: 5
      threshold_percent: 10
      window_minutes: 5
    - id: hf_drop_30m
      kind: health_factor_drop
      rearm_percent: 10
      threshold_percent: 20
      window_minutes: 30
    - id: debt_up_5m
      kind: debt_growth
      rearm_percent: 10
      threshold_percent: 20
      window_minutes: 5
    - id: debt_up_30m
      kind: debt_growth
      rearm_percent: 20
      threshold_percent: 40
      window_minutes: 30
    - id: debt_up_60m
      kind: debt_growth
      rearm_percent: 30
      threshold_percent: 60
      window_minutes: 60
  severity: warning
  stress_rules:
    - id: collateral_down_10
      collateral_change_percent: -10
      debt_change_percent: 0
      threshold: 1.05
  telegram_auth: $res:u/oneke/yeap-bot
  telegram_chat_id: '-1004252768572'
  user: '0x166Ce42Df5f4BAA94aBC5B62C60dab1B3C73D2a3'
cron_version: v2
enabled: false
is_flow: true
no_flow_overlap: true
schedule: 0 */1 * * * *
script_path: u/oneke/0x166Ce42Df5f4BAA94aBC5B62C60dab1B3C73D2a3/morpho_hf_monitor
timezone: Asia/Shanghai
ws_error_handler_muted: false
