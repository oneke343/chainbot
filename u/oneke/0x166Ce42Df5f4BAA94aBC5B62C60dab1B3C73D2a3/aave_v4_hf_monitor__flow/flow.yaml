summary: Aave V4 health-factor monitor for 0x166Ce42
description: Run the reusable Aave V4 monitor, build at most one warning
  message, and send it to the configured destinations. All instance parameters
  come from the trigger.
value:
  modules:
    - id: monitor
      summary: Evaluate Aave V4 health factors
      value:
        type: flow
        input_transforms:
          api:
            type: javascript
            expr: flow_input.api
          chain_ids:
            type: javascript
            expr: flow_input.chain_ids
          default_threshold:
            type: javascript
            expr: flow_input.default_threshold
          market_thresholds:
            type: javascript
            expr: flow_input.market_thresholds
          user:
            type: javascript
            expr: flow_input.user
        path: f/aave/flows/aave_v4_health
    - id: alert_policy
      summary: Build at most one alert message
      value:
        type: script
        input_transforms:
          monitor_output:
            type: javascript
            expr: results.monitor
          severity:
            type: javascript
            expr: flow_input.severity
        path: f/chain_sentinel/scripts/alert_policies/matched_output
    - id: destinations
      summary: Send the optional alert to configured destinations
      value:
        type: branchall
        parallel: true
        branches:
          - summary: Telegram
            expr: ''
            skip_failure: false
            modules:
              - id: send_to_telegram
                summary: Send the optional alert to Telegram
                value:
                  type: script
                  input_transforms:
                    auth:
                      type: javascript
                      expr: flow_input.telegram_auth
                    chat_id:
                      type: javascript
                      expr: flow_input.telegram_chat_id
                    message:
                      type: javascript
                      expr: results.alert_policy.message
                  path: f/chain_sentinel/scripts/destinations/send_telegram
                retry:
                  exponential:
                    attempts: 3
                    multiplier: 2
                    random_factor: 20
                    seconds: 2
                timeout:
                  type: static
                  value: 30
          - summary: FlashDuty
            expr: flow_input.flashduty_enabled === true
            skip_failure: false
            modules:
              - id: send_to_flashduty
                summary: Send the optional alert to FlashDuty
                value:
                  type: script
                  input_transforms:
                    alert_key:
                      type: javascript
                      expr: flow_input.flashduty_alert_key
                    destination:
                      type: javascript
                      expr: flow_input.flashduty_destination
                    message:
                      type: javascript
                      expr: results.alert_policy.message
                  path: f/chain_sentinel/scripts/destinations/send_flashduty
                retry:
                  exponential:
                    attempts: 3
                    multiplier: 2
                    random_factor: 20
                    seconds: 2
                timeout:
                  type: static
                  value: 30
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  order:
    - api
    - user
    - default_threshold
    - market_thresholds
    - chain_ids
    - severity
    - telegram_auth
    - telegram_chat_id
    - flashduty_enabled
    - flashduty_destination
    - flashduty_alert_key
  properties:
    api:
      type: object
      format: resource-graphql
    user:
      type: string
      pattern: ^0x[0-9a-fA-F]{40}$
    default_threshold:
      type: number
      exclusiveMinimum: 0
    market_thresholds:
      type: object
      additionalProperties:
        type: number
        exclusiveMinimum: 0
      description: Optional thresholds keyed by Aave V4 market name.
    chain_ids:
      type: array
      description: Empty monitors every Aave V4 mainnet discovered by the API.
      items:
        type: integer
        minimum: 1
      uniqueItems: true
    severity:
      type: string
      enum:
        - info
        - warning
        - critical
    telegram_auth:
      type: object
      format: resource-telegram
    telegram_chat_id:
      type: string
    flashduty_enabled:
      type: boolean
      default: true
    flashduty_destination:
      type: object
      format: resource-flashduty
    flashduty_alert_key:
      type: string
  required:
    - api
    - user
    - default_threshold
    - market_thresholds
    - chain_ids
    - severity
    - telegram_auth
    - telegram_chat_id
    - flashduty_enabled
    - flashduty_destination
    - flashduty_alert_key
