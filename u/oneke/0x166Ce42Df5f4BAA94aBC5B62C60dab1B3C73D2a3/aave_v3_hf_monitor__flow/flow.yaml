summary: Aave V3 health-factor monitor for 0x166Ce42
description: Run the reusable Aave V3 monitor and configured destinations. All
  instance parameters come from the trigger.
value:
  modules:
    - id: monitor
      summary: Run the Aave health-factor monitor
      value:
        type: flow
        input_transforms:
          aave_api:
            type: javascript
            expr: flow_input.aave_api
          chain_ids:
            type: javascript
            expr: flow_input.chain_ids
          market_thresholds:
            type: javascript
            expr: flow_input.market_thresholds
          default_threshold:
            type: javascript
            expr: flow_input.default_threshold
          risk_rules:
            type: javascript
            expr: flow_input.risk_rules ?? []
          stress_rules:
            type: javascript
            expr: flow_input.stress_rules ?? []
          risk_options:
            type: javascript
            expr: flow_input.risk_options ?? {}
          message_policy:
            type: javascript
            expr: flow_input.message_policy ?? {}
          user:
            type: javascript
            expr: flow_input.user
        path: f/aave/flows/aave_health
      continue_on_error: false
    - id: alert_policy
      summary: Build alert messages from matched Monitor outputs
      value:
        type: script
        input_transforms:
          monitor_output:
            type: javascript
            expr: results.monitor
          severity:
            type: javascript
            expr: flow_input.severity
        is_trigger: false
        path: f/chain_sentinel/scripts/alert_policies/matched_output
    - id: a
      summary: ''
      value:
        type: branchall
        branches:
          - modules:
              - id: send_to_telegram
                summary: Send alert messages to Telegram
                value:
                  type: script
                  input_transforms:
                    auth:
                      type: javascript
                      expr: flow_input.telegram_auth
                    chat_id:
                      type: javascript
                      expr: flow_input.telegram_chat_id
                    messages:
                      type: javascript
                      expr: results.alert_policy.messages
                  is_trigger: false
                  path: f/chain_sentinel/scripts/destinations/send_telegram
                retry:
                  exponential:
                    attempts: 3
                    multiplier: 2
                    random_factor: 20
                    seconds: 2
                timeout:
                  type: static
                  value: 120
            expr: ''
            parallel: true
            skip_failure: false
          - summary: ''
            modules:
              - id: send_to_flashduty
                summary: Send alert messages to FlashDuty
                value:
                  type: script
                  input_transforms:
                    alert_key:
                      type: javascript
                      expr: flow_input.flashduty_alert_key
                    destination:
                      type: javascript
                      expr: flow_input.flashduty_destination
                    messages:
                      type: javascript
                      expr: results.alert_policy.messages
                  is_trigger: false
                  path: f/chain_sentinel/scripts/destinations/send_flashduty
                retry:
                  exponential:
                    attempts: 3
                    multiplier: 2
                    random_factor: 20
                    seconds: 2
                timeout:
                  type: static
                  value: 120
            expr: flow_input.flashduty_enabled === true
            parallel: true
            skip_failure: false
        parallel: true
  groups: []
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  order:
    - aave_api
    - user
    - chain_ids
    - market_thresholds
    - risk_rules
    - stress_rules
    - risk_options
    - message_policy
    - severity
    - telegram_auth
    - telegram_chat_id
    - flashduty_enabled
    - flashduty_destination
    - flashduty_alert_key
  properties:
    aave_api:
      type: object
      format: resource-graphql
    user:
      type: string
      pattern: ^0x[0-9a-fA-F]{40}$
    chain_ids:
      type: array
      items:
        type: integer
        minimum: 1
      uniqueItems: true
    market_thresholds:
      type: object
      description: Health-factor thresholds keyed by Aave V3 market name.
      additionalProperties:
        oneOf:
          - type: string
          - type: number
    default_threshold:
      type: number
      exclusiveMinimum: 0
    risk_rules: &risk_rules_schema
      type: array
      default: []
      items:
        type: object
        additionalProperties: false
        properties:
          id: {type: string, pattern: '^[A-Za-z0-9_-]{1,64}$'}
          kind: {type: string, enum: [health_factor_drop, debt_growth, liquidation_buffer]}
          threshold_percent: {type: number, exclusiveMinimum: 0}
          window_minutes: {type: integer, minimum: 1, maximum: 1440}
          min_debt_usd: {type: number, minimum: 0}
          rearm_percent: {type: number, minimum: 0}
        required: [id, kind, threshold_percent]
    stress_rules:
      type: array
      default: []
      items:
        type: object
        additionalProperties: false
        properties:
          id: {type: string, pattern: '^[A-Za-z0-9_-]{1,64}$'}
          collateral_change_percent: {type: number, exclusiveMinimum: -100}
          debt_change_percent: {type: number, exclusiveMinimum: -100}
          threshold: {type: number, exclusiveMinimum: 0}
          min_debt_usd: {type: number, minimum: 0}
        required: [id, collateral_change_percent, threshold]
    risk_options:
      type: object
      additionalProperties: false
      default: {rearm_health_factor_margin: 0.05, repeat_interval_minutes: 60}
      properties:
        rearm_health_factor_margin: {type: number, minimum: 0}
        repeat_interval_minutes: {type: number, minimum: 0}
    message_policy: &message_policy_schema
      type: object
      additionalProperties: false
      default: {max_messages: 20, overflow: summary}
      properties:
        max_messages: {type: integer, minimum: 1, maximum: 100}
        overflow: {type: string, enum: [summary, truncate]}
    severity:
      type: string
      enum:
        - info
        - warning
        - critical
    telegram_auth:
      type: object
      format: resource-telegram
    telegram_chat_id:
      type: string
    flashduty_enabled:
      type: boolean
      default: true
    flashduty_destination:
      type: object
      format: resource-flashduty
    flashduty_alert_key:
      type: string
  required:
    - aave_api
    - user
    - chain_ids
    - market_thresholds
    - default_threshold
    - severity
    - telegram_auth
    - telegram_chat_id
    - flashduty_enabled
    - flashduty_destination
    - flashduty_alert_key
