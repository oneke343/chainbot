summary: Aave V3 health-factor monitor for 0x166Ce42
description: Run the reusable Aave V3 monitor and configured destinations. All
  instance parameters come from the trigger.
value:
  modules:
    - id: monitor
      summary: Run the Aave health-factor monitor
      value:
        type: flow
        input_transforms:
          aave_api:
            type: javascript
            expr: flow_input.aave_api
          chain_ids:
            type: javascript
            expr: flow_input.chain_ids
          market_thresholds:
            type: javascript
            expr: flow_input.market_thresholds
          user:
            type: javascript
            expr: flow_input.user
        path: f/aave/flows/aave_health
      continue_on_error: false
    - id: alert_policy
      summary: Build one alert message from matched Monitor outputs
      value:
        type: script
        input_transforms:
          monitor_output:
            type: javascript
            expr: results.monitor
          severity:
            type: javascript
            expr: flow_input.severity
        is_trigger: false
        path: f/chain_sentinel/scripts/alert_policies/matched_output
    - id: a
      summary: ''
      value:
        type: branchall
        branches:
          - modules:
              - id: send_to_telegram
                summary: Send an alert to Telegram
                value:
                  type: script
                  input_transforms:
                    auth:
                      type: javascript
                      expr: flow_input.telegram_auth
                    chat_id:
                      type: javascript
                      expr: flow_input.telegram_chat_id
                    message:
                      type: javascript
                      expr: results.alert_policy.message
                  is_trigger: false
                  path: f/chain_sentinel/scripts/destinations/send_telegram
            expr: ''
            parallel: true
            skip_failure: false
          - summary: ''
            modules:
              - id: send_to_flashduty
                summary: Send an alert to FlashDuty
                value:
                  type: script
                  input_transforms:
                    alert_key:
                      type: javascript
                      expr: flow_input.flashduty_alert_key
                    destination:
                      type: javascript
                      expr: flow_input.flashduty_destination
                    message:
                      type: javascript
                      expr: results.alert_policy.message
                  is_trigger: false
                  path: f/chain_sentinel/scripts/destinations/send_flashduty
            expr: flow_input.flashduty_enabled === true
            parallel: true
            skip_failure: false
        parallel: true
  groups: []
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  order:
    - aave_api
    - user
    - chain_ids
    - market_thresholds
    - severity
    - telegram_auth
    - telegram_chat_id
    - flashduty_enabled
    - flashduty_destination
    - flashduty_alert_key
  properties:
    aave_api:
      type: object
      format: resource-graphql
    user:
      type: string
      pattern: ^0x[0-9a-fA-F]{40}$
    chain_ids:
      type: array
      items:
        type: integer
        minimum: 1
      uniqueItems: true
    market_thresholds:
      type: object
      description: Health-factor thresholds keyed by Aave V3 market name.
      additionalProperties:
        oneOf:
          - type: string
          - type: number
    severity:
      type: string
      enum:
        - info
        - warning
        - critical
    telegram_auth:
      type: object
      format: resource-telegram
    telegram_chat_id:
      type: string
    flashduty_enabled:
      type: boolean
      default: true
    flashduty_destination:
      type: object
      format: resource-flashduty
    flashduty_alert_key:
      type: string
  required:
    - aave_api
    - user
    - chain_ids
    - market_thresholds
    - severity
    - telegram_auth
    - telegram_chat_id
    - flashduty_enabled
    - flashduty_destination
    - flashduty_alert_key
