summary: Monitor Aave V4 market params changes
description: Read Hub, Spoke, reserve, historical risk configs, oracle sources,
  permissions and proxy settings on configured networks; notify Telegram on
  changes.
value:
  modules:
    - id: source
      summary: Read complete market configuration snapshots
      value:
        type: script
        input_transforms:
          api:
            type: javascript
            expr: flow_input.api
          chain_ids:
            type: javascript
            expr: flow_input.chain_ids
          rpc_urls:
            type: javascript
            expr: flow_input.rpc_urls
        path: f/aave/scripts/sources/aave_v4_market_params
      timeout:
        type: static
        value: 300
    - id: rules
      summary: Compare configurations and save the new baseline
      value:
        type: script
        input_transforms:
          inputs:
            type: javascript
            expr: results.source
        path: f/aave/scripts/rules/evaluate_aave_v4_market_params
    - id: alert_policy
      summary: Build market configuration change alerts
      value:
        type: script
        input_transforms:
          monitor_output:
            type: javascript
            expr: results.rules
          severity:
            type: javascript
            expr: flow_input.severity
        path: f/chain_sentinel/scripts/alert_policies/matched_output
    - id: send_to_telegram
      summary: Send configuration changes to Telegram
      value:
        type: script
        input_transforms:
          auth:
            type: javascript
            expr: flow_input.telegram_auth
          chat_id:
            type: javascript
            expr: flow_input.telegram_chat_id
          messages:
            type: javascript
            expr: results.alert_policy.messages
        path: f/chain_sentinel/scripts/destinations/send_telegram
      retry:
        exponential:
          attempts: 3
          multiplier: 2
          random_factor: 20
          seconds: 2
      timeout:
        type: static
        value: 30
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  order:
    - api
    - chain_ids
    - rpc_urls
    - severity
    - telegram_auth
    - telegram_chat_id
  properties:
    api:
      type: object
      format: resource-graphql
    chain_ids:
      type: array
      items:
        type: integer
        minimum: 1
      minItems: 1
      uniqueItems: true
    rpc_urls:
      type: object
      additionalProperties:
        type: string
      description: Explicit RPC URLs keyed by chain ID; each must match its configured
        network.
    severity:
      type: string
      enum:
        - info
        - warning
        - critical
    telegram_auth:
      type: object
      format: resource-telegram
    telegram_chat_id:
      type: string
      minLength: 1
  required:
    - api
    - chain_ids
    - rpc_urls
    - severity
    - telegram_auth
    - telegram_chat_id
