summary: Monitor BTCUSDT price changes and alert Telegram
description: Run the Binance spot price-change monitor every minute using three
  OR-combined rules and send newly triggered alerts to Telegram. All instance
  parameters come from the trigger.
value:
  modules:
    - id: monitor
      summary: Evaluate BTCUSDT price-change rules
      value:
        type: flow
        input_transforms:
          connection:
            type: javascript
            expr: flow_input.connection
          rules:
            type: javascript
            expr: flow_input.rules
          symbol:
            type: javascript
            expr: flow_input.symbol
        path: f/binance/flows/spot_price_change
    - id: alert_policy
      summary: Build one warning message for newly triggered rules
      value:
        type: script
        input_transforms:
          monitor_output:
            type: javascript
            expr: results.monitor
          severity:
            type: javascript
            expr: flow_input.severity
        path: f/chain_sentinel/scripts/alert_policies/matched_output
    - id: send_to_telegram
      summary: Send the optional message to Telegram
      value:
        type: script
        input_transforms:
          auth:
            type: javascript
            expr: flow_input.telegram_auth
          chat_id:
            type: javascript
            expr: flow_input.telegram_chat_id
          message:
            type: javascript
            expr: results.alert_policy.message
        path: f/chain_sentinel/scripts/destinations/send_telegram
      retry:
        exponential:
          attempts: 3
          multiplier: 2
          random_factor: 20
          seconds: 2
      timeout:
        type: static
        value: 30
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  order:
    - connection
    - symbol
    - rules
    - severity
    - telegram_auth
    - telegram_chat_id
  properties:
    connection:
      type: object
      format: resource-http_connection
    symbol:
      type: string
      pattern: ^[A-Za-z0-9]{2,30}$
    rules:
      type: array
      minItems: 1
      maxItems: 50
      items:
        type: object
        additionalProperties: false
        properties:
          id:
            type: string
            pattern: ^[A-Za-z0-9_-]{1,64}$
          direction:
            type: string
            enum:
              - up
              - down
              - either
          min_quote_volume:
            type: number
            minimum: 0
          min_trade_count:
            type: integer
            minimum: 0
          rearm_percent:
            type: number
            minimum: 0
          threshold_percent:
            type: number
            exclusiveMinimum: 0
          window_minutes:
            type: integer
            minimum: 1
            maximum: 998
        required:
          - id
          - window_minutes
          - direction
          - threshold_percent
    severity:
      type: string
      enum:
        - info
        - warning
        - critical
    telegram_auth:
      type: object
      format: resource-telegram
    telegram_chat_id:
      type: string
  required:
    - connection
    - symbol
    - rules
    - severity
    - telegram_auth
    - telegram_chat_id
