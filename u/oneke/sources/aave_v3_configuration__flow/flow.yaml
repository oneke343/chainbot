summary: Collect Aave V3 configuration
description: Collect configuration snapshots from all Aave V3 mainnets using one
  GraphQL query.
value:
  modules:
    - id: collect_configuration
      summary: Collect Aave V3 market params
      value:
        type: script
        input_transforms:
          api:
            type: static
            value: $res:f/aave/resources/aave_v3
        path: f/aave/sources/v3/market_params
      timeout:
        type: static
        value: 180
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  order: []
  properties: {}
  required: []
