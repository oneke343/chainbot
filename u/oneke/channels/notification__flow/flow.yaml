summary: Route notifications by message level
description: Send all messages through the Windmill Hub Telegram integration,
  and also send error messages to FlashDuty.
value:
  modules:
    - id: notify
      summary: Send to configured channels
      value:
        type: branchall
        branches:
          - summary: Telegram
            modules:
              - id: telegram
                summary: Send message through Telegram Hub integration
                value:
                  type: script
                  input_transforms:
                    auth:
                      type: static
                      value: $res:u/oneke/resources/yeap-bot
                    chat_id:
                      type: javascript
                      expr: variable("u/oneke/channels/telegram_chat_id")
                    text:
                      type: javascript
                      expr: '`[${flow_input.message.level}]
                        ${flow_input.message.title}\n\n${flow_input.message.description}`'
                  path: hub/28512/telegram/send_a_text_message_or_reply
                timeout:
                  type: static
                  value: 30
            expr: ''
            parallel: true
            skip_failure: false
          - summary: FlashDuty for errors
            modules:
              - id: flashduty
                summary: Send error message to FlashDuty
                value:
                  type: script
                  input_transforms:
                    destination:
                      type: static
                      value: $res:u/oneke/resources/flashcat
                    messages:
                      type: javascript
                      expr: |
                        [{
                          title: flow_input.message.title,
                          description: flow_input.message.description,
                          severity: "critical",
                          fields: { level: flow_input.message.level }
                        }]
                  path: f/chain_sentinel/scripts/destinations/send_flashduty
                skip_if:
                  expr: flow_input.message.level !== "error"
                timeout:
                  type: static
                  value: 30
            expr: ''
            parallel: true
            skip_failure: false
        parallel: true
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  properties:
    message:
      type: object
      additionalProperties: false
      properties:
        description:
          type: string
        level:
          type: string
          enum:
            - info
            - warning
            - error
        title:
          type: string
      required:
        - level
        - title
        - description
  required:
    - message
