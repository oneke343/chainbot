defaultTs: bun
includes:
  - 'c_*.resource-type.yaml'
  - f/aave/**
  - f/binance/**
  - f/okx/**
  - f/hyperliquid/**
  - f/morpho/**
  - f/spark/** # Retain sync scope until remote deletion is deployed.
  - f/chain_sentinel/**
  - f/wmm/**
  - f/handlebars/**
  - u/oneke/**
excludes: [
  "u/**/**/__monitor_state.resource.yaml"
]
skipVariables: false
skipResources: false
skipResourceTypes: false
skipSecrets: true
includeSchedules: true
includeTriggers: true
nonDottedPaths: true
syncBehavior: v1
workspaces:
  chainbot:
    baseUrl: https://windmill.yeap.capital/
    gitBranch: main
