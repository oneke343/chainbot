description: Final alert message produced by AlertPolicy and consumed by
  Destination Senders.
format_extension: null
is_fileset: false
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  additionalProperties: false
  properties:
    description:
      type: string
      minLength: 1
    fields:
      type: object
      additionalProperties: true
      description: Structured alert context passed to Destination Senders.
    severity:
      type: string
      enum:
        - info
        - warning
        - critical
    title:
      type: string
      minLength: 1
  required:
    - title
    - description
    - severity
    - fields
