schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  additionalProperties: false
  required:
    - title
    - description
    - severity
    - fields
  properties:
    title:
      type: string
      minLength: 1
    description:
      type: string
      minLength: 1
    severity:
      type: string
      enum:
        - info
        - warning
        - critical
    fields:
      type: object
      additionalProperties: true
      description: Structured alert context passed to Destination Senders.
description: Final alert message produced by AlertPolicy and consumed by Destination Senders.
