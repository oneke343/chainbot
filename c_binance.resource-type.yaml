description: Binance HMAC API endpoint.
format_extension: null
is_fileset: false
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  properties:
    api_key:
      type: string
      description: Binance API HMAC key.
      password: true
    api_secret:
      type: string
      description: Binance API HMAC secret.
      password: true
    url:
      type: string
      description: Base URL for Binance API endpoints.
      default: https://api.binance.com
      format: uri
  required:
    - url
    - api_key
    - api_secret
